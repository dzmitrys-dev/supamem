name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
        # - "3.13"  # add when GH runners stable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        env:
          # pytrec_eval vendors trec_eval 9.0.8 C source; modern GCC defaults to
          # C23 and rejects its qsort pointer types / conflicting declarations.
          CFLAGS: -std=gnu17
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev,eval]' "ruff==0.15.12"
      - name: Lint
        run: ruff check src/supamem
      - name: Test
        run: pytest tests/ -v
